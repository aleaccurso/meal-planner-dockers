version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/db"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: "docker-compose"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns: ["*"]
